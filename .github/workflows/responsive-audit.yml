name: Browser responsive audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run responsive checks and capture screenshots
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          // Dense width sweep, not just named device presets: catches issues at
          // intermediate widths and around CSS breakpoints.
          const widths = [
            320, 344, 360, 375, 390, 414, 430, 480, 540, 600, 640, 700,
            701, 720, 768, 800, 820, 834, 900, 960, 1000, 1024, 1050, 1100,
            1101, 1199, 1200, 1280, 1366, 1440, 1600, 1920,
          ];
          const screenshotWidths = new Set([320, 390, 768, 1024, 1366, 1920]);
          const failures = [];
          const results = [];
          await mkdir('responsive-audit', { recursive: true });

          for (const width of widths) {
            const mobileOrTablet = width <= 1024;
            const height = width <= 430 ? 850 : width <= 1024 ? 1000 : 900;
            const name = `width-${width}`;
            const page = await browser.newPage({
              viewport: { width, height },
              isMobile: width <= 600,
              deviceScaleFactor: 1,
            });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            const response = await page.goto('file://' + process.cwd() + '/index.html', {
              waitUntil: 'networkidle',
              timeout: 30000,
            });
            await page.evaluate(async () => {
              for (const img of document.querySelectorAll('img[loading="lazy"]')) img.loading = 'eager';
              await Promise.all([...document.images].map(img => img.decode().catch(() => {})));
            });
            const metrics = await page.evaluate(() => {
              const hero = document.querySelector('.hero-showcase-art');
              const frame = document.querySelector('.hero-showcase');
              const banner = document.querySelector('.hero-banner');
              const heroCopy = document.querySelector('.typing-container');
              const heroArt = frame?.getBoundingClientRect();
              const heroCopyRect = heroCopy?.getBoundingClientRect();
              const bannerStyle = banner ? getComputedStyle(banner) : null;
              const nav = document.querySelector('body > nav');
              const main = document.querySelector('main#main-content');
              const overflowingElements = [...document.querySelectorAll('body *')]
                .filter(el => {
                  const rect = el.getBoundingClientRect();
                  const style = getComputedStyle(el);
                  return style.display !== 'none' && style.visibility !== 'hidden' &&
                    rect.width > 0 && (rect.left < -2 || rect.right > document.documentElement.clientWidth + 2);
                })
                .slice(0, 8)
                .map(el => ({ tag: el.tagName, className: String(el.className?.baseVal ?? el.className ?? '').slice(0, 90) }));
              return {
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
                overflowingElements,
                heroFound: Boolean(hero),
                heroLoaded: Boolean(hero && hero.complete && hero.naturalWidth > 0),
                heroFrame: heroArt ? { width: Math.round(heroArt.width), height: Math.round(heroArt.height) } : null,
                heroLayout: bannerStyle?.flexDirection ?? 'unknown',
                heroCopyAndArtOverlap: Boolean(heroCopyRect && heroArt &&
                  heroCopyRect.left < heroArt.right && heroCopyRect.right > heroArt.left &&
                  heroCopyRect.top < heroArt.bottom && heroCopyRect.bottom > heroArt.top),
                navFound: Boolean(nav),
                mainFound: Boolean(main),
                visibleImagesBroken: [...document.images].filter(img => {
                  const r = img.getBoundingClientRect();
                  return r.width > 0 && (!img.complete || img.naturalWidth === 0);
                }).map(img => img.getAttribute('src')).slice(0, 10),
              };
            });
            const result = { viewport: name, status: response?.status(), ...metrics, pageErrors };
            results.push(result);
            console.log(JSON.stringify(result));

            if (!response || response.status() >= 400) failures.push(`${name}: page response failed`);
            if (metrics.horizontalOverflow) failures.push(`${name}: horizontal overflow (${metrics.documentWidth}px > ${metrics.viewportWidth}px)`);
            if (!metrics.heroFound || !metrics.heroLoaded) failures.push(`${name}: hero artwork did not load`);
            if (!metrics.navFound || !metrics.mainFound) failures.push(`${name}: key page landmark missing`);
            if (metrics.visibleImagesBroken.length) failures.push(`${name}: images failed: ${metrics.visibleImagesBroken.join(', ')}`);
            if (pageErrors.length) failures.push(`${name}: browser JavaScript errors: ${pageErrors.join('; ')}`);

            // Per requirement, phone and tablet widths should retain the stacked
            // mobile/tablet hero composition; desktop starts above 1024px.
            if (mobileOrTablet && metrics.heroLayout !== 'column') {
              failures.push(`${name}: expected mobile/tablet stacked hero, got flex-direction ${metrics.heroLayout}`);
            }
            if (screenshotWidths.has(width)) {
              await page.screenshot({
                path: `responsive-audit/${name}.png`,
                fullPage: true,
                animations: 'disabled',
              });
            }
            await page.close();
          }

          await browser.close();
          console.log(JSON.stringify({ summary: {
            widthsTested: results.length,
            passedWidths: results.length - new Set(failures.map(f => f.split(':')[0])).size,
            failures,
          }}));
          if (failures.length) {
            console.error('Responsive audit failures:\\n' + failures.join('\\n'));
            process.exit(1);
          }
          NODE
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-screenshots
          path: responsive-audit/
          if-no-files-found: warn
          retention-days: 7
