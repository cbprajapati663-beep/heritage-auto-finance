name: Browser responsive audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run responsive checks and capture screenshots
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const viewports = [
            { name: 'mobile-360', width: 360, height: 800, mobile: true },
            { name: 'mobile-390', width: 390, height: 844, mobile: true },
            { name: 'mobile-430', width: 430, height: 932, mobile: true },
            { name: 'desktop-1366', width: 1366, height: 900, mobile: false },
          ];
          const failures = [];
          await mkdir('responsive-audit', { recursive: true });

          for (const viewport of viewports) {
            const page = await browser.newPage({
              viewport: { width: viewport.width, height: viewport.height },
              isMobile: viewport.mobile,
              deviceScaleFactor: viewport.mobile ? 1 : 1,
            });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            const response = await page.goto('file://' + process.cwd() + '/index.html', {
              waitUntil: 'networkidle',
              timeout: 30000,
            });
            await page.screenshot({
              path: `responsive-audit/${viewport.name}.png`,
              fullPage: true,
              animations: 'disabled',
            });
            const metrics = await page.evaluate(() => {
              const hero = document.querySelector('.hero-showcase-art');
              const frame = document.querySelector('.hero-showcase');
              return {
                viewportWidth: document.documentElement.clientWidth,
                documentWidth: document.documentElement.scrollWidth,
                horizontalOverflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
                heroFound: Boolean(hero),
                heroLoaded: Boolean(hero && hero.complete && hero.naturalWidth > 0),
                heroFrame: frame ? {
                  width: Math.round(frame.getBoundingClientRect().width),
                  height: Math.round(frame.getBoundingClientRect().height),
                } : null,
              };
            });
            console.log(JSON.stringify({ viewport: viewport.name, status: response?.status(), ...metrics, pageErrors }));
            if (!response || response.status() >= 400) failures.push(`${viewport.name}: page response failed`);
            if (metrics.horizontalOverflow) failures.push(`${viewport.name}: horizontal overflow (${metrics.documentWidth}px > ${metrics.viewportWidth}px)`);
            if (!metrics.heroFound || !metrics.heroLoaded) failures.push(`${viewport.name}: hero artwork did not load`);
            if (pageErrors.length) failures.push(`${viewport.name}: browser JavaScript errors: ${pageErrors.join('; ')}`);
            await page.close();
          }

          await browser.close();
          if (failures.length) {
            console.error('Responsive audit failures:\\n' + failures.join('\\n'));
            process.exit(1);
          }
          NODE
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-screenshots
          path: responsive-audit/
          if-no-files-found: warn
          retention-days: 7
