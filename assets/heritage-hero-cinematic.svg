<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">Heritage Auto Finance cinematic SUV showroom</title>
<desc id="desc">A premium dark SUV in a dramatic night showroom with violet architecture, gold lighting and a reflective floor.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05060c"/><stop offset=".48" stop-color="#10091d"/><stop offset="1" stop-color="#03040a"/></linearGradient>
 <radialGradient id="violet"><stop stop-color="#7134a0" stop-opacity=".7"/><stop offset="1" stop-color="#15091f" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#85729b"/><stop offset=".32" stop-color="#292334"/><stop offset="1" stop-color="#080a12"/></linearGradient>
 <linearGradient id="paint" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#777783"/><stop offset=".14" stop-color="#353641"/><stop offset=".42" stop-color="#11131b"/><stop offset=".72" stop-color="#292a35"/><stop offset="1" stop-color="#06070c"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b641b"/><stop offset=".45" stop-color="#ffe4a0"/><stop offset="1" stop-color="#bc811b"/></linearGradient>
 <linearGradient id="floor" y2="1"><stop stop-color="#291333" stop-opacity=".3"/><stop offset="1" stop-color="#05050a"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<ellipse cx="990" cy="370" rx="490" ry="370" fill="url(#violet)"/>
<!-- showroom glass and architectural lighting -->
<path d="M650 0V570M845 0V570M1040 0V570M1235 0V570" stroke="#c4a2e0" stroke-opacity=".13" stroke-width="3"/>
<path d="M620 0L760 570M810 0L910 570M1000 0L1060 570M1190 0L1210 570" stroke="#f1c66e" stroke-opacity=".09" stroke-width="3"/>
<path d="M0 570H1400" stroke="#d3a454" stroke-opacity=".32" stroke-width="2"/>
<path d="M0 0H1400V18H0Z" fill="#d9b66a" opacity=".6"/>
<path d="M720 0H750V570H720Z" fill="#a04bd0" opacity=".22"/>
<ellipse cx="840" cy="680" rx="490" ry="70" fill="#a243cf" opacity=".24" filter="url(#soft)"/>
<path d="M0 580L1400 550V900H0Z" fill="url(#floor)"/>
<path d="M0 730L1400 665M0 810L1400 770M180 900L490 575M570 900L720 575M1030 900L930 575" stroke="#c7a15b" stroke-opacity=".13" stroke-width="2"/>
<!-- SUV cast shadow -->
<ellipse cx="810" cy="690" rx="490" ry="62" fill="#010205" opacity=".9" filter="url(#soft)"/>
<!-- body silhouette -->
<path d="M330 565L384 483Q408 449 471 430L600 366Q645 345 711 345L874 350Q925 353 969 393L1068 467L1168 495Q1200 505 1218 542L1235 596Q1238 618 1211 628L1137 649L399 649L315 614Q301 603 310 583Z" fill="url(#paint)" stroke="#a3a0b1" stroke-opacity=".6" stroke-width="4"/>
<!-- hood reflections -->
<path d="M953 461L1135 496M934 475L1168 523M384 490L560 451" stroke="#c5b8d4" stroke-opacity=".36" stroke-width="4"/>
<path d="M486 432L604 375Q646 358 706 359L858 364Q900 365 936 401L1000 462Z" fill="url(#glass)" stroke="#b8a6ca" stroke-opacity=".58" stroke-width="4"/>
<path d="M716 359L708 461M862 365L906 462" stroke="#bdb2c9" stroke-opacity=".45" stroke-width="5"/>
<path d="M490 435L1000 465" stroke="#f5dca0" stroke-opacity=".22" stroke-width="3"/>
<!-- lights -->
<path d="M329 565Q371 539 421 552L440 571L419 592L321 589Z" fill="#fff1c7" opacity=".96"/>
<path d="M327 565L413 556" stroke="#fff8e5" stroke-width="8" filter="url(#glow)"/>
<path d="M1092 495L1175 526Q1195 539 1202 561L1186 580L1111 563Z" fill="#6e1127" stroke="#ff6680" stroke-width="4"/>
<path d="M1107 510L1181 541" stroke="#ff8ba0" stroke-width="7" filter="url(#glow)"/>
<!-- door seams, trim and gold highlight -->
<path d="M455 463L455 625M925 465L963 622M496 488H600M693 489H803" stroke="#aaa4b8" stroke-opacity=".42" stroke-width="3"/>
<path d="M473 506L1055 506" stroke="url(#gold)" stroke-width="3" opacity=".85"/>
<path d="M318 606Q700 655 1212 600" fill="none" stroke="url(#gold)" stroke-width="4"/>
<path d="M360 627Q750 676 1162 626" fill="none" stroke="#e9c46d" stroke-opacity=".25" stroke-width="5"/>
<!-- wheels -->
<g><circle cx="490" cy="629" r="87" fill="#030407" stroke="#777580" stroke-width="9"/><circle cx="490" cy="629" r="63" fill="#151720" stroke="url(#gold)" stroke-width="4"/><circle cx="490" cy="629" r="41" fill="#282a34" stroke="#92909e" stroke-width="4"/><circle cx="490" cy="629" r="13" fill="#c4c0cc"/><g stroke="#9c9aa8" stroke-width="6"><path d="M490 582V676M443 629H537M457 596L523 662M523 596L457 662"/></g></g>
<g><circle cx="1010" cy="629" r="87" fill="#030407" stroke="#777580" stroke-width="9"/><circle cx="1010" cy="629" r="63" fill="#151720" stroke="url(#gold)" stroke-width="4"/><circle cx="1010" cy="629" r="41" fill="#282a34" stroke="#92909e" stroke-width="4"/><circle cx="1010" cy="629" r="13" fill="#c4c0cc"/><g stroke="#9c9aa8" stroke-width="6"><path d="M1010 582V676M963 629H1057M977 596L1043 662M1043 596L977 662"/></g></g>
<!-- wet-floor reflections -->
<path d="M355 714Q750 768 1155 710" fill="none" stroke="#9e4ac4" stroke-opacity=".4" stroke-width="20" filter="url(#soft)"/>
<path d="M400 735L580 750M700 751L850 764M965 740L1100 728" stroke="#e1bb69" stroke-opacity=".18" stroke-width="5"/>
<!-- subtle brand framing -->
<path d="M76 86H300M76 86V166M1325 720V800H1245" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".8"/>
<text x="80" y="230" fill="#f3c766" font-family="Arial,sans-serif" font-size="18" letter-spacing="5">HERITAGE AUTO FINANCE</text>
<path d="M80 250H300" stroke="url(#gold)" stroke-width="2"/>
<text x="80" y="305" fill="#fff8e9" font-family="Georgia,serif" font-size="33" font-weight="700">Move forward.</text>
<text x="80" y="347" fill="#d9cbe8" font-family="Georgia,serif" font-size="28">With confidence.</text>
<text x="80" y="386" fill="#b4a7c2" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">PERSONAL · COMMERCIAL · REFINANCE</text>
</svg>